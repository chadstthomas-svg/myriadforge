name: pytest

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install test dependencies
        run: uv sync --group boolean-tests
      - name: Run hardware-free test suites
        run: |
          uv run --no-sync python -c "import onnx, onnxruntime; from sentencepiece import sentencepiece_model_pb2"
          uv run --no-sync pytest -q tests labs/shave_models/boolean/test_boolean.py
