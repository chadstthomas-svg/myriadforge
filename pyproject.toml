[project]
name = "myriadforge"
version = "0.1.0"
description = "Reviving the Intel Neural Compute Stick (Myriad 2): a dual-backend OpenVINO shim, async-pipelined throughput, and 2026 edge-AI apps on discontinued silicon."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Chad St. Thomas" }]
keywords = ["myriad", "movidius", "ncs1", "neural-compute-stick", "openvino", "edge-ai", "vpu", "myriad2"]
dependencies = [
    "numpy>=1.26",
    "huggingface-hub>=0.34",
]

[project.optional-dependencies]
racklab-tuning = ["scikit-learn>=1.5,<2"]
racklab = ["sentencepiece>=0.2.1,<1"]

[dependency-groups]
dev = ["pytest>=8.0"]
boolean-tests = [
    "onnx>=1.19",
    "onnxruntime>=1.22",
    "sentencepiece>=0.2.1",
]

[project.scripts]
myriadforge = "myriadforge.cli:main"
racklab-tune = "myriadforge.racklab_tuning:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/myriadforge"]

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = ["tools", "models", "data", "vendor", "results", ".venv", "*.egg-info", "docs"]
